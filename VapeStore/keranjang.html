<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keranjang Belanja</title>
    <link rel="stylesheet" href="keranjang.css" />
  </head>
  <body>
    <div class="container">
      <h1>Keranjang Belanja</h1>
      <table class="product-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nama Produk</th>
            <th>Harga</th>
            <th>Jumlah</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="product-list">
          <!-- Data akan dimasukkan di sini menggunakan JavaScript -->
        </tbody>
      </table>
      <button id="add-product-btn">Tambah Produk</button>
      <a href="index.html" class="btn-home">Kembali ke Home</a>
    </div>

    <!-- Modal untuk Tambah/Edit Produk -->
    <div id="product-modal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modal-title">Tambah Produk</h2>
        <form id="product-form">
          <input type="hidden" id="product-id" />
          <label for="nama_produk">Nama Produk:</label>
          <input type="text" id="nama_produk" required />
          <label for="harga_produk">Harga Produk:</label>
          <input type="number" id="harga_produk" required />
          <label for="jumlah_produk">Jumlah Produk:</label>
          <input type="number" id="jumlah_produk" required />
          <button type="submit" id="save-btn">Simpan</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
